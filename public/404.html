<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Safe Sun</title>
    <script>
      // GitHub Pages SPA redirect — preserves path/query for client-side router
      (function () {
        var base = '/Safe-Sun/';
        var l = window.location;
        var path = l.pathname.indexOf(base) === 0 ? l.pathname.slice(base.length) : '';
        l.replace(base + '?p=/' + path + (l.search ? '&q=' + l.search.slice(1) : '') + l.hash);
      })();
    </script>
  </head>
  <body></body>
</html>
