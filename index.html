  <body>
    <div id="root"></div>
    <script>
      // GitHub Pages SPA redirect restore
      (function () {
        var q = new URLSearchParams(window.location.search);
        if (q.has('p')) {
          var p = q.get('p') || '/';
          var extra = q.get('q');
          // CAMBIO 1: Agregada barra final para corregir la ruta base
          var base = '/Safe-Sun/'; 
          window.history.replaceState(null, '', base + p + (extra ? '?' + extra : '') + window.location.hash);
        }
      })();
    </script>
    <!-- CAMBIO 2: Agregado punto (.) para que la ruta sea relativa y cargue en GitHub Pages -->
    <script type="module" src="./src/main.tsx"></script>
  </body>
